<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruno Cheng</title>
    <!-- 引入字体组合 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['"Instrument Serif"', 'serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        /* 背景流动暗光氛围 */
        body {
            background-color: #09090b;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.08) 0%, transparent 55%),
                radial-gradient(circle at 80% 90%, rgba(120, 120, 140, 0.06) 0%, transparent 45%);
            min-height: 100vh;
        }

        /* 细腻噪点纹理 */
        .noise {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
        }

        /* 胶囊按钮样式与弹性动效 */
        .link-pill {
            background: rgba(24, 24, 27, 0.72);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .link-pill:hover {
            background: rgba(39, 39, 42, 0.88);
            border-color: rgba(255, 255, 255, 0.25);
            transform: scale(1.018);
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.7);
        }
        .link-pill:active {
            transform: scale(0.985);
        }

        /* 逐行入场动画 */
        @keyframes popIn {
            0% { opacity: 0; transform: translateY(14px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-item {
            opacity: 0;
            animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="text-zinc-100 font-sans antialiased selection:bg-white selection:text-black relative flex flex-col items-center justify-between px-4 py-12 sm:py-16">

    <!-- 胶片颗粒遮罩 -->
    <div class="fixed inset-0 noise pointer-events-none z-50"></div>

    <!-- 顶部极简分享按钮 -->

            </svg>

    <!-- 主体居中容器 -->

        <!-- 1. 头像与名字 -->
<div class="w-full h-full rounded-full bg-zinc-900 flex items-center justify-center overflow-hidden">
    <img src="avatar.jpg" alt="Bruno Cheng" class="w-full h-full object-cover">
</div>
                </div>

                <div class="flex items-center gap-4">

                <div class="flex items-center gap-4">

                <svg class="w-4 h-4 text-zinc-500 group-hover:text-white group-hover:translate-x-0.5 transition-all" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                </svg>
            </a>

            <!-- Spotify -->
            <a href="https://open.spotify.com/user/31bq27rjeeaglziac6zgxcstcfhm?si=D9K6ENz0QPCRt1ZHeWl36Q&utm_source=copy-link" target="_blank" rel="noopener noreferrer"
               class="link-pill flex items-center justify-between w-full rounded-2xl px-5 py-4 group animate-item" style="animation-delay: 0.34s;">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-white/[0.05] border border-white/[0.06] flex items-center justify-center text-zinc-300 group-hover:bg-white group-hover:text-black transition-colors">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.72 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>

                <svg class="w-4 h-4 text-zinc-500 group-hover:text-white group-hover:translate-x-0.5 transition-all" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

    </main>

    <!-- 极简底部签名 -->
    <footer class="mt-14 text-center z-10 animate-item" style="animation-delay: 0.42s;">
        <span class="font-mono text-[11px] text-zinc-600 tracking-widest uppercase">
            © 2026 BRUNO CHENG
        </span>
    </footer>

    <!-- 复制成功提示气泡 -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-white text-black font-mono text-xs px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        Link copied to clipboard
    </div>

    <script>
        function copyPageLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.remove('opacity-0');
                setTimeout(() => toast.classList.add('opacity-0'), 2000);
            });
        }
    </script>
</body>
</html>
