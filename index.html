    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['"Instrument Serif"', 'serif'],

                    }

    <style>
        html {
            scroll-behavior: smooth;
        }

        /* 背景流动暗光氛围 */
        body {
            background-color: #09090b;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.08) 0%, transparent 55%),
                radial-gradient(circle at 80% 90%, rgba(120, 120, 140, 0.06) 0%, transparent 45%);
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* 细腻噪点纹理 */
        .noise {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
        }

        /* 胶囊按钮样式与弹性动效 */
        .link-pill {
            background: rgba(24, 24, 27, 0.72);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .link-pill:hover {
            background: rgba(39, 39, 42, 0.88);
            border-color: rgba(255, 255, 255, 0.25);
            transform: scale(1.018);
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.7);
        }
        .link-pill:active {
            transform: scale(0.985);
        }

        /* 逐行入场动画 */
        @keyframes popIn {
            0% { opacity: 0; transform: translateY(12px) scale(0.985); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-item {
            animation: popIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        /* Apps 文件夹平滑下拉 + 渐显动效 */
        .folder-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            transform: translateY(-6px);
            pointer-events: none;
            transition:
                grid-template-rows 0.34s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.26s ease,
                transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .folder-wrapper.is-open {
            grid-template-rows: 1fr;
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .folder-inner {
            overflow: hidden;
        }
    </style>
</head>
